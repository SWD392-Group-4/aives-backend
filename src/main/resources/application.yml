spring:
  application:
    name: aives-backend
  profiles:
    # postgres (mac dinh) | sqlserver (ban cu) | supabase | dev (H2 in-memory)
    active: ${SPRING_PROFILES_ACTIVE:postgres}
    default: postgres
  servlet:
    multipart:
      # File cau hoi giang vien gui len (pdf / docx / txt)
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aives}
      auto-index-creation: false
  # SMTP de gui email (mat khau tam khi admin tao tai khoan). Chi duoc dung khi app.mail.enabled = true.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@aives.local}}
    from-name: AIVES
  ai:
    claude:
      # Key tao o console.anthropic.com. De trong = tat AI (app van chay, khong hoi xoay / cham bang AI).
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_MODEL:claude-haiku-5-5}
      # So token toi da model tra loi: viec nang (cham diem, doc file, sinh cau hoi) / hoi xoay luc dang thi
      max-tokens: ${CLAUDE_MAX_TOKENS:8192}
      quick-max-tokens: ${CLAUDE_QUICK_MAX_TOKENS:2048}
      # So lan goi lai khi loi tam thoi (429 / 5xx / 529): viec nang / hoi xoay luc dang thi
      max-retries: ${CLAUDE_MAX_RETRIES:3}
      quick-max-retries: ${CLAUDE_QUICK_MAX_RETRIES:1}
      retry-delay-ms: ${CLAUDE_RETRY_DELAY_MS:2000}
      # Thoi gian toi da cho 1 lan goi AI khi dang thi (ms). Qua thoi gian nay he thong tu chuyen cau hoi tiep theo.
      read-timeout-ms: ${CLAUDE_TIMEOUT_MS:20000}
      long-read-timeout-ms: ${CLAUDE_LONG_TIMEOUT_MS:120000}
  # Google Cloud Speech-to-Text (STT) + Text-to-Speech (TTS). De trong GOOGLE_SPEECH_CREDENTIALS = tat (app van chay).
  speech:
    credentials-path: ${GOOGLE_SPEECH_CREDENTIALS:}
    language-code: ${SPEECH_LANGUAGE_CODE:vi-VN}
    sample-rate-hertz: ${SPEECH_SAMPLE_RATE_HERTZ:48000}
    voice-name: ${TTS_VOICE_NAME:vi-VN-Standard-A}
    speaking-rate: ${TTS_SPEAKING_RATE:1.0}
  # Google Cloud Vertex AI RAG & Cloud Storage cho FLOW-LECTURER-PREP-001
  rag:
    project-id: ${GOOGLE_RAG_PROJECT_ID:precise-ray-512018-v9}
    location: ${GOOGLE_RAG_LOCATION:asia-southeast1}
    bucket-name: ${GOOGLE_RAG_BUCKET:exam-slides-bucket-2026}
    corpus-id: ${GOOGLE_RAG_CORPUS_ID:6917529027641081856}
    credentials-path: ${GOOGLE_RAG_CREDENTIALS:../rag-key.json}
  # Noi luu hoc lieu cua chuong:
  #   local (mac dinh): luu file tren may chay backend + doc chu PDF/PPTX/DOCX, KHONG can Google Cloud
  #   gcs: Google Cloud Storage + Vertex AI RAG (can rag-key.json o muc rag ben tren)
  materials:
    storage: ${MATERIAL_STORAGE:local}
    local-dir: ${MATERIAL_LOCAL_DIR:uploads/materials}
  viva:
    default-question-count: ${VIVA_DEFAULT_QUESTION_COUNT:3}
  grading:
    auto-enabled: ${GRADING_AUTO_ENABLED:true}
    poll-interval-ms: ${GRADING_POLL_INTERVAL_MS:5000}
  seed:
    # false (mac dinh): khong co du lieu mau. Neu database dang co 2 bai hoc mau ("Toan lop 6 - 7 (du lieu mau)",
    #   "Kien truc phan mem (du lieu mau)") thi luc khoi dong se XOA HAN chung, kem chu de, cau hoi va moi
    #   luot thi / diem / don phuc khao cua cac phien thi da dung cau hoi mau.
    # true: tao bo cau hoi mau Toan lop 6 - 7 neu chua co (profile dev / test tu dong dung gia tri nay).
    sample-content: ${SEED_SAMPLE_CONTENT:false}
    admin:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
      full-name: System Admin
    default-password: ${SEED_DEFAULT_PASSWORD}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
