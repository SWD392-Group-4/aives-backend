spring:
  application:
    name: aives-backend
  profiles:
    # postgres (mac dinh) | sqlserver (ban cu) | supabase | dev (H2 in-memory)
    active: ${SPRING_PROFILES_ACTIVE:postgres}
    default: postgres
  servlet:
    multipart:
      # File cau hoi giang vien gui len (pdf / docx / txt)
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # SMTP de gui email (mat khau tam khi admin tao tai khoan). Chi duoc dung khi app.mail.enabled = true.
  # Gmail: MAIL_USERNAME = dia chi gmail, MAIL_PASSWORD = App Password 16 ky tu (KHONG phai mat khau dang nhap gmail).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Khong de request tao tai khoan treo lau khi SMTP khong phan hoi (ms)
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Bat buoc >= 32 ky tu. Moi truong that phai dat bien moi truong JWT_SECRET.
    secret: ${JWT_SECRET:aives-dev-only-secret-key-change-me-0123456789}
    access-token-expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Dia chi FE, dung de chen link dang nhap vao email
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    # false (mac dinh): KHONG gui email, chi in noi dung ra console cua backend (de dev khi chua co SMTP).
    # true: gui that qua SMTP o muc spring.mail phia tren.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@aives.local}}
    from-name: AIVES
  # AI: Gemini (key tao o https://aistudio.google.com/apikey, dat trong file .env, KHONG commit)
  ai:
    gemini:
      # De trong = tat AI: phong van van chay nhung khong co cau hoi xoay
      api-key: ${GEMINI_API_KEY:}
      # Ten model lay tu danh sach https://ai.google.dev/gemini-api/docs/models. Google doi ten kha thuong xuyen:
      # gap loi HTTP 404 "model ... is no longer available" thi doi GEMINI_MODEL trong .env theo goi y trong loi.
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      # Model du phong (cach nhau bang dau phay), dung khi model chinh qua tai (HTTP 503) hoac het luot (429)
      # du da goi lai. De trong (GEMINI_FALLBACK_MODELS=) = khong dung model du phong.
      # Khong dung gemini-3.7-flash: deprecated tu 08/10/2026, Google tu chuyen sang 3.8 nen du phong vo tac dung.
      fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.6-flash,gemini-3.5-flash-lite}
      # Model rieng cho viec DOC FILE cau hoi / rubric (chi tach du lieu): Flash-Lite nhanh hon nhieu.
      # De trong (GEMINI_IMPORT_MODEL=) = dung model chinh. Loi tam thoi thi tu chuyen sang model chinh.
      import-model: ${GEMINI_IMPORT_MODEL:gemini-3.5-flash-lite}
      # So lan goi lai model chinh khi loi tam thoi: viec nang (cham diem, doc file) / hoi xoay luc dang thi
      max-retries: ${GEMINI_MAX_RETRIES:3}
      quick-max-retries: ${GEMINI_QUICK_MAX_RETRIES:1}
      # Cho truoc lan goi lai dau tien (ms), cac lan sau gap doi, toi da 10 giay
      retry-delay-ms: ${GEMINI_RETRY_DELAY_MS:2000}
      # Thoi gian toi da cho 1 lan goi AI khi dang thi (ms). Qua thoi gian nay he thong tu chuyen cau hoi tiep theo.
      read-timeout-ms: ${GEMINI_TIMEOUT_MS:20000}
      # Thoi gian toi da cho viec nang: cham diem 1 cau hoi, doc file cau hoi giang vien gui len (ms)
      long-read-timeout-ms: ${GEMINI_LONG_TIMEOUT_MS:120000}
      # Muc "suy nghi" cua dong Gemini 3: low / medium / high (gemini-3.8-flash KHONG nhan minimal, mac dinh medium).
      # low = tra loi nhanh nhat. De trong = dung mac dinh cua model.
      thinking-level: ${GEMINI_THINKING_LEVEL:low}
      # Kieu cu cua dong Gemini 2.5 (0 = tat suy nghi). Chi dung khi thinking-level de trong. -1 = khong gui.
      thinking-budget: ${GEMINI_THINKING_BUDGET:-1}
  viva:
    # Phien thi chua duoc gan cau hoi thi tu lay bay nhieu cau APPROVED (giai phap tam):
    # uu tien bo cau hoi moi nhat cua nguoi tao phien, khong co thi lay du lieu mau
    default-question-count: ${VIVA_DEFAULT_QUESTION_COUNT:3}
  grading:
    # true: backend tu chot luot thi qua han va goi AI cham cac luot thi vua xong (chay ngam)
    auto-enabled: ${GRADING_AUTO_ENABLED:true}
    # Bao lau quet 1 lan (ms)
    poll-interval-ms: ${GRADING_POLL_INTERVAL_MS:5000}
  seed:
    # false (mac dinh): khong co du lieu mau. Neu database dang co 2 bai hoc mau ("Toan lop 6 - 7 (du lieu mau)",
    #   "Kien truc phan mem (du lieu mau)") thi luc khoi dong se XOA HAN chung, kem chu de, cau hoi va moi
    #   luot thi / diem / don phuc khao cua cac phien thi da dung cau hoi mau.
    # true: tao bo cau hoi mau Toan lop 6 - 7 neu chua co (profile dev / test tu dong dung gia tri nay).
    sample-content: ${SEED_SAMPLE_CONTENT:false}
    admin:
      email: ${ADMIN_EMAIL:admin@aives.local}
      password: ${ADMIN_PASSWORD:Admin@123}
      full-name: System Admin
    # Mat khau chung cho lecturer / student mau do DataInitializer tao
    default-password: ${SEED_DEFAULT_PASSWORD:123456}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
