spring:
  application:
    name: aives-backend
  profiles:
    # dev = H2 in-memory (chua can SQL Server). Khi co DB: chay voi profile "sqlserver".
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Bat buoc >= 32 ky tu. Moi truong that phai dat bien moi truong JWT_SECRET.
    secret: ${JWT_SECRET:aives-dev-only-secret-key-change-me-0123456789}
    access-token-expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    admin:
      email: ${ADMIN_EMAIL:admin@aives.local}
      password: ${ADMIN_PASSWORD:Admin@123}
      full-name: System Admin

springdoc:
  swagger-ui:
    path: /swagger-ui.html
