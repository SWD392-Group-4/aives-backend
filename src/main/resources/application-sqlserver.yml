# Profile: SQL Server, database "aives"
spring:
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=aives;encrypt=true;trustServerCertificate=true}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:123456}}
    hikari:
      pool-name: AivesHikariMSSQL
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        use_nationalized_character_data: true
