# Profile mac dinh: SQL Server, database "aives". Tao bang truoc bang database/01_users.sql.
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=aives;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:12345}
  jpa:
    hibernate:
      # Bang duoc tao bang script trong thu muc database/, Hibernate khong tu sua schema.
      ddl-auto: none
