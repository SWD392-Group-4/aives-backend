# Profile: supabase (PostgreSQL tren Supabase)
spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:100}
      minimum-idle: ${DB_MIN_IDLE:10}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      # Tu dong tao / cap nhat bang tren Supabase tu JPA Entity (Code-First)
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
