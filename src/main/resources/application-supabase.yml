# Profile: supabase (PostgreSQL tren Supabase)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      # Tu dong tao / cap nhat bang tren Supabase tu JPA Entity (Code-First)
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
