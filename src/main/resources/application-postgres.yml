# Profile: PostgreSQL (mac dinh), database "aives"
# Khi khoi dong, PostgresDatabaseCreator tu tao database "aives" va cac bang (script db/postgres/00_init_aives.sql)
# neu chua co. Tat bang DB_AUTO_CREATE=false trong .env. Sau do Hibernate cap nhat bang (ddl-auto: update).
app:
  db:
    auto-create: ${DB_AUTO_CREATE:true}
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aives}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:123456}}
    hikari:
      pool-name: AivesHikariPostgres
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    properties:
      hibernate:
        # Dialect PostgreSQL duoc Hibernate tu nhan tu JDBC URL, khong can khai bao
        # Gom insert / update thanh lo (nhap 60 cau hoi tu file chi ton vai lan goi DB)
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
